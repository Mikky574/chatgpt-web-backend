<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>主控对话</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#1e293b;font:15px/1.6 system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce2ea;background:white;border-radius:9px;padding:8px 14px}button:hover{background:#edf2f7}button:disabled{opacity:.5;cursor:default}.layout{display:flex;height:100dvh}aside{width:250px;background:#fff;border-right:1px solid #e2e8f0;padding:22px 14px;overflow:auto}h1{font-size:20px;margin:0 0 16px}#new{width:100%;background:#2563eb;color:white;border:0}#chats{margin-top:18px;display:grid;gap:8px}.chat{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selected{border-color:#2563eb;background:#eff6ff}main{flex:1;min-width:0;display:flex;flex-direction:column}header{padding:16px 26px;border-bottom:1px solid #e2e8f0;background:#fff}#title{font-weight:650}small,#health{color:#64748b;font-size:12px}#messages{flex:1;overflow:auto;padding:26px max(24px,calc((100% - 820px)/2));display:flex;flex-direction:column;gap:20px}.message{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #e2e8f0;border-radius:12px;padding:15px 18px;background:white}.user{background:#eaf1ff;margin-left:35px}.label{font-size:12px;color:#64748b;margin-bottom:6px}.empty{margin:auto;color:#64748b;text-align:center}footer{padding:14px 24px 20px;background:#fff;border-top:1px solid #e2e8f0}form{display:flex;gap:12px;max-width:820px;margin:auto}textarea{resize:vertical;min-height:72px;max-height:220px;flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:12px}#send{background:#2563eb;color:white;border:0;align-self:end}#status{max-width:820px;margin:7px auto;color:#64748b;font-size:13px;min-height:21px}#recover{font-size:12px;padding:2px 9px;margin-left:8px}#notice{max-width:820px;margin:5px auto 0;color:#64748b;font-size:12px}@media(max-width:650px){aside{width:125px;padding:14px 8px}h1{font-size:17px}header{padding:12px}#messages{padding:14px}.user{margin-left:12px}footer{padding:10px}form{gap:6px}}
</style></head><body><div class="layout"><aside><h1>主控对话</h1><label for="projects">ChatGPT 官网项目</label><button id="refresh-projects" type="button" aria-label="刷新官网项目" style="padding:1px 5px;margin-left:6px">↻</button><select id="projects" aria-label="项目" style="width:100%;padding:8px;margin:6px 0 10px"></select><form id="project-form" style="display:flex;margin-bottom:12px;gap:4px"><input id="project-name" aria-label="新项目名称" placeholder="新建官网项目" maxlength="80" style="min-width:0;width:100%;padding:6px"><button type="submit" aria-label="创建项目">＋</button></form><button id="new">＋ 新建任务</button><div id="chats"></div></aside><main><header><div id="title">新会话</div><div id="health">连接中…</div><a id="source" hidden target="_blank" rel="noopener noreferrer" style="font-size:12px" aria-label="打开官网原对话">打开官网原对话 ↗</a></header><div id="messages"></div><footer><form id="form"><textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行" aria-label="问题" maxlength="12000"></textarea><button id="send" type="submit">发送</button></form><div id="status"></div><div id="notice">同一会话保留上下文，新会话独立。聊天记录保存在当前浏览器；仅输入可披露内容。</div></footer></main></div><script src="/app.js"></script></body></html>
